name: Build mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Forge MDK 1.20.1
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Merge mod source into MDK
        run: |
          rm -rf mdk/src/main/java/com/example/examplemod
          cp -r src/. mdk/src/
          sed -i 's/^mod_id=.*/mod_id=tribefaith/; s/^mod_group_id=.*/mod_group_id=com.example.tribefaith/' mdk/gradle.properties

      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tribefaith-jar
          path: mdk/build/libs/*.jar
